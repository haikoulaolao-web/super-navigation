name: Update NAV KING Candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update candidate pool
        run: python scripts/update_candidates.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated candidate pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynamic-candidates.json

          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
          else
            git commit -m "chore: update NAV KING candidate pool"
            git push
          fi
