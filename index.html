<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0f">
  <meta name="description" content="导航王中王 NAV KING：互联网入口排名与决策引擎。">
  <title>导航王中王 · NAV KING</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="crown">👑</div>
    <div class="eyebrow">INDEX OF INDEXES</div>
    <h1>导航王中王</h1>
    <div class="en">NAV KING</div>
    <p class="tagline">互联网不缺资源。<br>缺的是有人告诉你先去哪。</p>

    <div class="search-wrap">
      <input id="searchInput" type="search" autocomplete="off" placeholder="直接说你想干什么，例如：我想学 Python">
      <button id="searchBtn">找入口</button>
    </div>

    <div class="quick" id="quickIntents">
      <button data-q="我想学编程">学编程</button>
      <button data-q="我想学英语">学英语</button>
      <button data-q="我要找AI工具">AI工具</button>
      <button data-q="我要找设计素材">设计素材</button>
      <button data-q="我要做游戏">游戏开发</button>
      <button id="randomBtn">🎲 随便逛逛</button>
    </div>

    <div id="decisionBox" class="decision hidden"></div>
  </header>

  <main>
    <section class="stats">
      <div><strong id="kingCount">0</strong><span>正式封王</span></div>
      <div><strong id="challengerCount">0</strong><span>挑战者</span></div>
      <div><strong id="activeCount">0</strong><span>持续维护</span></div>
    </section>

    <section class="intro">
      <p>别人筛选资源，我们筛选筛选者。</p>
      <p class="muted">王冠很少。没有达到标准，就不封王。</p>
    </section>

    <section>
      <div class="section-title"><span>👑</span><h2>本期王榜</h2></div>
      <div id="kingList" class="cards"></div>
    </section>

    <section>
      <div class="section-title"><span>⚔️</span><h2>王位争夺中</h2></div>
      <div id="candidateList" class="cards"></div>
    </section>

    <section class="vacant">
      <div class="section-title"><span>♟️</span><h2>王位空缺</h2></div>
      <p>游戏开发 · 学术研究 · 效率工具 · 开放阅读等赛道继续观察。宁缺毋滥。</p>
    </section>
  </main>

  <footer>
    <div>001 → ∞</div>
    <p>持续发现 · 持续复检 · 王位可以更换</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
